name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are pointless — cancel them, but never cancel a push to main mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODE_VERSION: "26.5"
  PROJECT: iBase.xcodeproj
  SCHEME: iBase

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # Every destination reports, so one platform's failure never hides another's.
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            destination: "platform=iOS Simulator,name=iPhone 17 Pro"
            device: "iPhone 17 Pro"
            slug: iphone
            # Behavioural tests only. Screenshot capture belongs to release.yml, where the images
            # are actually collected — running it here launched the app ten times per job and was
            # the surface for "Timed out while launching application via Xcode".
            testing: "-only-testing:iBaseTests -only-testing:iBaseUITests/iBaseUITests"
          - name: iPad
            destination: "platform=iOS Simulator,name=iPad Pro 13-inch (M5)"
            device: "iPad Pro 13-inch (M5)"
            slug: ipad
            testing: "-only-testing:iBaseTests -only-testing:iBaseUITests/iBaseUITests/testConvertCommitReloadAndDeleteJourney -only-testing:iBaseUITests/iBaseUITests/testSettingsControlsWhichBaseRowsAppear"
          - name: macOS
            destination: "platform=macOS"
            slug: macos
            # UI tests are iOS-only in CI: the journey drives swipe-to-delete, which has no
            # reliable AppKit equivalent. macOS still builds and runs the full unit suite.
            testing: "-only-testing:iBaseTests"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby and bundler cache
        uses: ruby/setup-ruby@v1
        with:
          # Explicit: the action errors out with "input ruby-version needs to be specified" when
          # there is no .ruby-version or .tool-versions file, which this repository does not carry.
          ruby-version: "3.3"
          bundler-cache: true

      - name: Generate project
        run: xcodegen generate

      - name: List available simulators
        if: matrix.slug != 'macos'
        run: xcrun simctl list devices available

      # The iPad leg failed a UI test with "Timed out while launching application via Xcode" — a cold
      # simulator racing the first app launch on a loaded runner, not a defect in the app. Booting
      # and waiting for the device to settle first removes the race.
      - name: Boot simulator
        if: matrix.slug != 'macos'
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(x['udid'] for v in d['devices'].values() for x in v if x['name']=='${{ matrix.device }}'))")
          echo "Booting ${{ matrix.device }} ($UDID)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep -F "${{ matrix.device }}"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ matrix.destination }}" \
            -resultBundlePath "artifacts/${{ matrix.slug }}-build.xcresult" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ matrix.destination }}" \
            -resultBundlePath "artifacts/${{ matrix.slug }}-test.xcresult" \
            -derivedDataPath DerivedData \
            ${{ matrix.testing }} \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload result bundle (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.slug }}
          path: artifacts/*.xcresult
          retention-days: 7
